<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Greeting App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="fx" aria-hidden="true"></canvas>

    <main class="app">
      <section class="card" role="region" aria-label="Greeting">
        <header class="header">
          <h1 class="title">Modern Greeting</h1>
          <p class="subtitle">A tiny UI with big vibes.</p>
        </header>

        <div class="field">
          <label class="label" for="nameInput">Enter Your Name</label>
          <input
            id="nameInput"
            class="input"
            type="text"
            inputmode="text"
            autocomplete="name"
            placeholder="Type your name here"
          />
        </div>

        <button id="greetBtn" class="btn" type="button">Greet</button>

        <div class="result" aria-live="polite" aria-atomic="true">
          <div id="greeting" class="greeting" hidden></div>
        </div>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
